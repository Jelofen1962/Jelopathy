name: Release Jelopathy Bundle

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Executable & Create Release
    runs-on: windows-latest

    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Manual Tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --tags
          git checkout ${{ github.event.inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target

      - name: Install Dependencies
        run: npm ci

      - name: Build Tauri
        run: npm run tauri build

      - name: Prepare Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundle_dist | Out-Null

          $exe = Get-ChildItem "src-tauri/target/release" -Filter "*.exe" -Recurse |
                 Where-Object { $_.Name -notmatch "uninstall|updater" } |
                 Select-Object -First 1

          if (-not $exe) {
            Write-Host "Contents of target/release:"
            Get-ChildItem "src-tauri/target/release" -Recurse
            throw "Executable not found."
          }

          Copy-Item $exe.FullName "bundle_dist/Jelopathy-v1.exe"

          if (Test-Path "server/server.py") {
            Copy-Item "server/server.py" bundle_dist/
          }

          if (Test-Path "server/main.go") {
            Copy-Item "server/main.go" bundle_dist/
          }

          Compress-Archive `
            -Path "bundle_dist/*" `
            -DestinationPath "Jelopathy-v1-Bundle.zip" `
            -Force

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            Jelopathy-v1-Bundle.zip
            bundle_dist/Jelopathy-v1.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}