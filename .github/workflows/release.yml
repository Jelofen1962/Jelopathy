name: Auto Tag, Build and Publish Jelopathy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      bump:
        description: "Version increment for the next automatic tag"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: jelopathy-auto-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  create-tag:
    name: Calculate version and create tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout source and all tags
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate next version, sync project versions, commit and tag
        id: version
        shell: bash
        env:
          BUMP_TYPE: ${{ inputs.bump || 'patch' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Find the highest stable vMAJOR.MINOR.PATCH tag. Ignore prereleases.
          TAG="$(python3 - <<'PY'
          import re
          import subprocess

          tags = subprocess.check_output(
              ["git", "tag", "--list", "v[0-9]*"], text=True
          ).splitlines()
          versions = []
          for tag in tags:
              match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag.strip())
              if match:
                  versions.append(tuple(map(int, match.groups())))

          if not versions:
              major, minor, patch = (0, 0, 0)
          else:
              major, minor, patch = max(versions)

          bump = __import__("os").environ.get("BUMP_TYPE", "patch")
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              major, minor, patch = major, minor + 1, 0
          else:
              major, minor, patch = major, minor, patch + 1

          print(f"v{major}.{minor}.{patch}")
          PY
          )"
          VERSION="${TAG#v}"
          echo "Creating release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Update versions inline. This intentionally does not depend on
          # scripts/set_version.py being present in the repository.
          python3 - "$VERSION" <<'PY'
          import json
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          root = pathlib.Path.cwd()

          for relative in (
              "package.json",
              "package-lock.json",
              "src-tauri/tauri.conf.json",
          ):
              path = root / relative
              if not path.exists():
                  raise SystemExit(f"Required version file is missing: {relative}")
              data = json.loads(path.read_text(encoding="utf-8"))
              data["version"] = version
              if relative == "package-lock.json":
                  packages = data.get("packages")
                  if isinstance(packages, dict) and isinstance(packages.get(""), dict):
                      packages[""]["version"] = version
              path.write_text(
                  json.dumps(data, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )

          cargo_toml = root / "src-tauri/Cargo.toml"
          cargo_text = cargo_toml.read_text(encoding="utf-8")
          cargo_text, count = re.subn(
              r'(?ms)(^\[package\]\s*.*?^version\s*=\s*)"[^\"]+"',
              lambda match: match.group(1) + f'"{version}"',
              cargo_text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update [package] version in src-tauri/Cargo.toml")
          cargo_toml.write_text(cargo_text, encoding="utf-8")

          lock_path = root / "src-tauri/Cargo.lock"
          if lock_path.exists():
              lock_text = lock_path.read_text(encoding="utf-8")
              lock_text, count = re.subn(
                  r'(?s)(\[\[package\]\]\s*\nname\s*=\s*"jelopathy"\s*\nversion\s*=\s*)"[^\"]+"',
                  lambda match: match.group(1) + f'"{version}"',
                  lock_text,
                  count=1,
              )
              if count == 1:
                  lock_path.write_text(lock_text, encoding="utf-8")
          print(f"Project versions synchronized to {version}")
          PY

          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): $TAG"
          git tag "$TAG"
          # Push the version bump back to the source branch, then publish the tag.
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "$TAG"

  build-windows:
    name: Windows · portable EXE + installer
    needs: create-tag
    runs-on: windows-latest
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> src-tauri/target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run tauri -- build --bundles nsis

      - name: Stage Windows release files
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.create-tag.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_TAG
          New-Item -ItemType Directory -Force release-assets | Out-Null

          $portable = "src-tauri/target/release/jelopathy.exe"
          if (-not (Test-Path $portable)) {
            Get-ChildItem "src-tauri/target/release" -Recurse | Select-Object FullName
            throw "Portable Jelopathy executable was not found."
          }
          Copy-Item $portable "release-assets/Jelopathy-$version-windows-x64-portable.exe"

          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File |
            Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated." }
          Copy-Item $installer.FullName "release-assets/Jelopathy-$version-windows-x64-setup.exe"

          Get-ChildItem release-assets | Select-Object Name, Length

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Linux · AppImage
    needs: create-tag
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.tag }}
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> src-tauri/target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run tauri -- build --bundles appimage

      - name: Stage AppImage
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.create-tag.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_TAG"
          mkdir -p release-assets
          mapfile -t images < <(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print)
          if [ "${#images[@]}" -eq 0 ]; then
            find src-tauri/target/release/bundle -maxdepth 3 -type f -print || true
            echo "AppImage was not generated."
            exit 1
          fi
          cp "${images[0]}" "release-assets/Jelopathy-${VERSION}-linux-x86_64.AppImage"
          chmod +x "release-assets/Jelopathy-${VERSION}-linux-x86_64.AppImage"
          ls -lh release-assets

      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - create-tag
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform assets
        uses: actions/download-artifact@v4
        with:
          pattern: "*-release-assets"
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum Jelopathy-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-tag.outputs.tag }}
          name: Jelopathy ${{ needs.create-tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/Jelopathy-*
            release-assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
